{% extends 'base.html' %}
{% block title %}PCR Template Setting — LabMS{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
<script src="https://unpkg.com/grapesjs"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
.pt-page { max-width: 1400px; margin: 0 auto; padding: 20px; font-size: 0.85rem; }
.pt-header { background: linear-gradient(135deg, #1a3d7c 0%, #0d6efd 100%); color: #fff; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.pt-title { font-size: 1.25rem; font-weight: 700; margin: 0; text-transform: uppercase; }
.pt-picker { background: #f8f9fa; border: 2px solid #1a3d7c; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: end; }
.pt-picker label { font-size: 0.7rem; font-weight: 800; color: #1a3d7c; text-transform: uppercase; margin-bottom: 4px; display: block; }
.pt-picker select { min-width: 320px; padding: 6px 10px; border: 2px solid #ced4da; border-radius: 8px; height: 36px; }
.pt-btn { border: 2px solid #1a3d7c; border-radius: 8px; background: #fff; color: #1a3d7c; font-weight: 700; padding: 6px 18px; height: 36px; cursor: pointer; }
.pt-btn-primary { background: linear-gradient(135deg, #1a3d7c 0%, #0d6efd 100%); color: #fff; }
.pt-card { border: 2px solid #212529; border-radius: 8px; background: #fff; margin-bottom: 16px; overflow: hidden; }
.pt-card-hd { background: linear-gradient(180deg, #0d6efd 0%, #1a3d7c 100%); color: #fff; padding: 10px 16px; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
.pt-card-body { padding: 0; }
#gjs { border: 1px solid #ced4da; border-radius: 4px; height: 750px; }
</style>
{% endblock %}

{% block content %}
<div class="pt-page">
  <div class="pt-header">
    <div>
      <h1 class="pt-title"><i class="bi bi-layout-text-window"></i> PCR Template Builder</h1>
      <div style="font-size: 0.8rem; color: #dbeafe;">Drag and drop to design the report layout</div>
    </div>
  </div>

  <form method="GET" action="{{ url_for('settings.pcr_templates') }}" class="pt-picker">
    <div>
      <label>Select PCR test</label>
      <select name="test_id" onchange="this.form.submit()">
        <option value="">— choose a test —</option>
        {% for t in pcr_tests %}
        <option value="{{ t.id }}" {% if selected and selected.id == t.id %}selected{% endif %}>
          {{ t.name }} ({{ t.code }})
        </option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="pt-btn">Load</button>
  </form>

  {% if selected %}
  <form method="POST" action="{{ url_for('settings.pcr_templates') }}" id="pcr-form">
    <input type="hidden" name="test_id" value="{{ selected.id }}">
    
    <div class="pt-card">
      <div class="pt-card-hd"><i class="bi bi-pencil-square"></i> Visual Layout Designer</div>
      <div class="pt-card-body">
        <div id="gjs"></div>
        <input type="hidden" name="layout_html" id="input-layout" value="{{ (tpl.layout_html or '') if tpl else '' }}">
      </div>
    </div>
    
    <div class="pt-card" style="margin-top: 20px;">
      <div class="pt-card-hd"><i class="bi bi-card-text"></i> Template Content</div>
      <div class="pt-card-body" style="padding: 15px;">
        
        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold; margin-bottom: 5px; display: block;">Interpretation</label>
          <textarea name="interpretation_html" class="form-control" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px;">{{ tpl.interpretation_html if tpl else '' }}</textarea>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold; margin-bottom: 5px; display: block;">Methodology</label>
          <textarea name="methodology_html" class="form-control" rows="6" style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px;">{{ tpl.methodology_html if tpl else '' }}</textarea>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold; margin-bottom: 5px; display: block;">Comments</label>
          <textarea name="comments_html" class="form-control" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px;">{{ tpl.comments_html if tpl else '' }}</textarea>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold; margin-bottom: 5px; display: block;">Suggestion</label>
          <textarea name="suggestion_html" class="form-control" rows="3" style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px;">{{ tpl.suggestion_html if tpl else '' }}</textarea>
        </div>

      </div>
    </div>

    <div style="text-align: right; margin-top: 20px;">
      <button type="submit" class="pt-btn pt-btn-primary">
        <i class="bi bi-check-lg"></i> Save Template
      </button>
    </div>
  </form>
  {% endif %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (!document.getElementById('gjs')) return;

    const editor = grapesjs.init({
        container: '#gjs',
        fromElement: false,
        height: '750px',
        storageManager: false,
        blockManager: {
            blocks: [
                { id: 'section', label: 'Section', content: '<div style="padding:20px; border: 1px dashed #ccc;">Section content</div>' },
                { id: 'text', label: 'Text', content: '<p style="margin: 0 0 10px 0;">Insert text here</p>' },
                { id: 'heading', label: 'Heading', content: '<h2 style="margin: 0 0 10px 0; font-size: 14pt; font-weight: bold;">Heading</h2>' },
                { id: 'divider', label: 'Divider', content: '<hr style="border-top: 1px solid #000; margin: 15px 0;">' },
                { id: 'specimen', label: 'Specimen Field', content: '<div style="display: flex; margin-bottom: 8px;"><div style="width: 120px; font-weight: bold;">SPECIMEN:</div><div>[[SPECIMEN]]</div></div>' },
                { id: 'result', label: 'Result Field', content: '<div style="display: flex; margin-bottom: 8px;"><div style="width: 120px; font-weight: bold;">RESULT:</div><div>[[RESULT]]</div></div>' },
                { id: 'viral_load', label: 'Viral Load', content: '<div style="display: flex; margin-bottom: 8px;"><div style="width: 120px; font-weight: bold;">VIRAL LOAD:</div><div>[[VIRAL_LOAD]]</div></div>' },
                { id: 'interp', label: 'Interpretation', content: '<div style="margin-bottom: 15px;"><div style="font-weight: bold; margin-bottom: 4px;">Interpretation:</div><div>[[INTERPRETATION]]</div></div>' },
                { id: 'method', label: 'Methodology', content: '<div style="margin-bottom: 15px;"><div style="font-weight: bold; margin-bottom: 4px;">Methodologies:</div><div>[[METHODOLOGY]]</div></div>' },
                { id: 'comments', label: 'Comments', content: '<div style="margin-bottom: 15px;"><div style="font-weight: bold; margin-bottom: 4px;">Comments:</div><div>[[COMMENTS]]</div></div>' },
                { id: 'suggestion', label: 'Suggestion', content: '<div style="margin-bottom: 15px;"><div style="font-weight: bold; margin-bottom: 4px;">Suggestion:</div><div>[[SUGGESTION]]</div></div>' }
            ]
        },
        canvas: {
            styles: [
                'body { font-family: Arial, sans-serif; font-size: 10pt; color: #000; padding: 20px; }',
                'h2 { font-size: 12pt; margin-top: 0; }'
            ]
        }
    });

    let existingHtml = document.getElementById('input-layout').value;
    if (!existingHtml) {
        existingHtml = `
        <div style="font-family: Arial, sans-serif; font-size: 10pt; color: #000; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <div style="font-weight: bold; font-size: 12pt;">MOLECULAR DIAGNOSTIC SECTION</div>
                <div style="text-align: right; font-size: 9pt; font-weight: bold;">
                    <div>Collection Date: [[COLLECTION_DATE]]</div>
                    <div>Reporting Date: [[REPORTING_DATE]]</div>
                </div>
            </div>
            <div style="border: 1px solid #000; padding: 5px 10px; font-weight: bold; margin-bottom: 15px;">
                [[TEST_NAME]]
            </div>
            <div style="display: flex; margin-bottom: 8px;">
                <div style="width: 120px; font-weight: bold;">SPECIMEN:</div>
                <div>[[SPECIMEN]]</div>
            </div>
            <div style="display: flex; margin-bottom: 8px;">
                <div style="width: 120px; font-weight: bold;">RESULT:</div>
                <div>[[RESULT]]</div>
            </div>
            <div style="display: flex; margin-bottom: 15px;">
                <div style="width: 120px; font-weight: bold;">VIRAL LOAD:</div>
                <div>[[VIRAL_LOAD]]</div>
            </div>
            <hr style="border: 0; border-top: 1px solid #000; margin: 15px 0 10px 0;">
            <div style="font-weight: bold; margin-bottom: 5px;">Interpretation:</div>
            <div style="font-size: 9.5pt; margin-bottom: 15px;">[[INTERPRETATION]]</div>
            <hr style="border: 0; border-top: 1px solid #000; margin: 15px 0 10px 0;">
            <div style="font-weight: bold; margin-bottom: 5px;">Methodologies:</div>
            <div style="font-size: 9.5pt; margin-bottom: 15px;">[[METHODOLOGY]]</div>
            <hr style="border: 0; border-top: 1px solid #000; margin: 15px 0 10px 0;">
            <div style="font-weight: bold; margin-bottom: 5px;">Comments:</div>
            <div style="font-size: 9.5pt; margin-bottom: 15px;">[[COMMENTS]]</div>
        </div>
        `;
    }
    editor.setComponents(existingHtml);

    document.getElementById('pcr-form').addEventListener('submit', function() {
        document.getElementById('input-layout').value = editor.getHtml();
    });
});
</script>
{% endblock %}
