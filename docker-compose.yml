services:
  web:
    build: .
    image: labms:latest
    container_name: labms
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      PORT: "8000"
      GUNICORN_WORKERS: "4"
      DATABASE_URL: sqlite:////app/instance/database.db
    volumes:
      # Persist the SQLite DB across container rebuilds
      - ./instance:/app/instance
      # Persist user uploads (logos, etc.)
      - ./static/uploads:/app/static/uploads
      # Persist logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
